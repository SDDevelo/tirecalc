                console.error("Помилка ініціалізації Firebase або аутентифікації:", e);
                const modal = document.createElement('div');
                modal.textContent = "Не вдалося підключитися до бази даних. Налаштування не будуть зберігатися.";
                modal.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background-color:#fff;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:1000;color:#000;";
                document.body.appendChild(modal);
                setTimeout(() => modal.remove(), 5000); // Remove after 5 seconds
            }
        };

        // Налаштування слухача в реальному часі для оновлень з бази даних
        const setupRealtimeListener = () => {
            if (!db) return;

            const settingsDocRef = doc(db, `artifacts/${appId}/public/data/tire_calculator_settings`, 'shared_settings');

            onSnapshot(settingsDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const settings = docSnap.data();
                    console.log("Оновлені налаштування отримано з бази даних:", settings);
                    updateUIFromFirestore(settings);
                } else {
                    console.log("Документ налаштувань ще не існує. Створюємо його.");
                    // Set default settings if the document doesn't exist
                    const defaultSettings = {
                        basePrices: {
                            price_14_min: "800", price_14_max: "1800",
                            price_14c_min: "1200", price_14c_max: "2200",
                            price_15_min: "1000", price_15_max: "2000",
                            price_15c_min: "1400", price_15c_max: "2500",
                            price_16_min: "1200", price_16_max: "2500",
                            price_16c_min: "1600", price_16c_max: "3000",
                            price_17_min: "1500", price_17_max: "3000",
                            price_17c_min: "1800", price_17c_max: "3500",
                            price_18_min: "1800", price_18_max: "3500",
                            price_19_min: "2200", price_19_max: "4000",
                            price_20_min: "2500", price_20_max: "4500",
                            price_21_min: "3000", price_21_max: "5000",
                            price_22_min: "3500", price_22_max: "6000",
                            price_23_min: "4000", price_23_max: "7000",
                            
                        },
                        roundingOption: 'none'
                    };
                    updateUIFromFirestore(defaultSettings);
                }
            }, (error) => {
                console.error("Помилка під час отримання даних:", error);
            });
        };

        // Оновлення UI на основі даних з Firestore
        const updateUIFromFirestore = (settings) => {
            // Оновлення діапазонів цін
            for (const id in settings.basePrices) {
                const input = document.getElementById(id);
                if (input && input.value !== settings.basePrices[id]) {
                    input.value = settings.basePrices[id];
                }
            }

            // Оновлення опції округлення
            const roundingInput = document.querySelector(`input[name="rounding_option"][value="${settings.roundingOption}"]`);
            if (roundingInput && !roundingInput.checked) {
                roundingInput.checked = true;
                // Оновлення вигляду кнопок
                updateRadioButtons('roundingButtons', 'rounding-label');
            }
        };

        // Зберігає всі налаштування в Firestore
        const saveSettingsToFirestore = async () => {
            if (!db || !auth.currentUser) {
                console.warn("База даних не готова або користувач не аутентифікований. Збереження неможливе.");
                return;
            }

            const settingsDocRef = doc(db, `artifacts/${appId}/public/data/tire_calculator_settings`, 'shared_settings');
            const settings = {
                basePrices: {},
                roundingOption: document.querySelector('input[name="rounding_option"]:checked').value
            };

            const priceInputs = document.querySelectorAll('#pricesContent input[type="number"]');
            priceInputs.forEach(input => {
                settings.basePrices[input.id] = input.value;
            });
            
            try {
                await setDoc(settingsDocRef, settings);
                console.log("Налаштування успішно збережено в Firestore.");
            } catch (e) {
                console.error("Помилка при збереженні налаштувань:", e);
                const modal = document.createElement('div');
                modal.textContent = "Не вдалося зберегти налаштування. Спробуйте пізніше.";
                modal.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background-color:#fff;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:1000;color:#000;";
                document.body.appendChild(modal);
                setTimeout(() => modal.remove(), 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const diameterSelect = document.getElementById('diameter');
            const supplierSelect = document.getElementById('supplier');
            const calculateBtn = document.getElementById('calculateBtn');
            const resultDiv = document.getElementById('result');
            const priceDisplay = document.getElementById('priceDisplay');
            
            const togglePricesBtn = document.getElementById('togglePricesBtn');
            const pricesContent = document.getElementById('pricesContent');
            const pricesChevron = document.getElementById('pricesChevron');

            const updateRadioButtons = (containerId, labelClass) => {
                const container = document.getElementById(containerId);
                const labels = container.querySelectorAll(`.${labelClass}`);
                
                labels.forEach(label => {
                    const input = document.getElementById(label.htmlFor);
                    if (input && input.checked) {
                        label.classList.add('bg-blue-600', 'text-white');
                        label.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-gray-100');
                    } else {
                        label.classList.remove('bg-blue-600', 'text-white');
                        label.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-gray-100');
                    }
                });
            };

            const setupRadioButtons = (containerId, labelClass) => {
                const container = document.getElementById(containerId);
                container.addEventListener('click', (event) => {
                    if (event.target.tagName === 'LABEL') {
                        const input = document.getElementById(event.target.htmlFor);
                        if (input) {
                            input.checked = true;
                            updateRadioButtons(containerId, labelClass);
                            // Зберігаємо зміни в базу даних, якщо це налаштування, що зберігаються
                            if (containerId === 'roundingButtons') {
                                saveSettingsToFirestore();
                            }
                        }
                    }
                });
                updateRadioButtons(containerId, labelClass);
            };

            setupRadioButtons('treadDepthButtons', 'tread-label');
            setupRadioButtons('yearButtons', 'year-label');
            setupRadioButtons('seasonButtons', 'season-label');
            setupRadioButtons('roundingButtons', 'rounding-label');

            function toggleSection(button, content, chevron) {
                const isHidden = content.classList.contains('hidden');
                if (isHidden) {
                    content.classList.remove('hidden');
                    chevron.classList.remove('rotate-0');
                    chevron.classList.add('rotate-180');
                } else {
                    content.classList.add('hidden');
                    chevron.classList.remove('rotate-180');
                    chevron.classList.add('rotate-0');
                }
            }
            
            togglePricesBtn.addEventListener('click', () => toggleSection(togglePricesBtn, pricesContent, pricesChevron));

            // Додаємо слухачі подій для збереження налаштувань цін
            document.querySelectorAll('#pricesContent input[type="number"]').forEach(input => {
                input.addEventListener('input', () => {
                    saveSettingsToFirestore();
                });
            });

            const calculatePrice = () => {
                const selectedDiameter = diameterSelect.value;
                const minPriceInput = document.getElementById(`price_${selectedDiameter}_min`);
                const maxPriceInput = document.getElementById(`price_${selectedDiameter}_max`);
                
                if (!minPriceInput || !maxPriceInput) {
                    const modal = document.createElement('div');
                    modal.textContent = "Будь ласка, оберіть коректний діаметр шини.";
                    modal.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background-color:#fff;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:1000;color:#000;";
                    document.body.appendChild(modal);
                    setTimeout(() => modal.remove(), 3000);
                    return;
                }
                
                const minPrice = parseFloat(minPriceInput.value);
                const maxPrice = parseFloat(maxPriceInput.value);

                if (isNaN(minPrice) || isNaN(maxPrice) || minPrice < 0 || maxPrice < minPrice) {
                    const modal = document.createElement('div');
                    modal.textContent = "Будь ласка, введіть коректний діапазон цін.";
                    modal.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background-color:#fff;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:1000;color:#000;";
                    document.body.appendChild(modal);
                    setTimeout(() => modal.remove(), 3000);
                    return;
                }

                const basePrice = (minPrice + maxPrice) / 2;

                const treadDepthMultipliers = {
                    '8.0': 1.15, '7.5': 1.10, '7.0': 1.05,
                    '6.5': 1.0, '6.0': 0.95, '5.5': 0.90,
                    '5.0': 0.80, '4.5': 0.70, '4.0': 0.60
                };
                const supplierMultipliers = {
                    'GE': 1.0, 
                    'PL': 1.15
                };
                const seasonMultipliers = {
                    'summer': 1.0,
                    'winter': 1.10,
                    'all_season': 0.95
                };
                
                const selectedYear = parseInt(document.querySelector('input[name="year"]:checked').value);
                const currentYear = new Date().getFullYear();
                const age = currentYear - selectedYear;
                let yearFactor = 1.0;
                if (age > 0) {
                    yearFactor = 1.0 - (age * 0.02); 
                    if (yearFactor < 0.5) yearFactor = 0.5;
                }

                const selectedTreadDepth = document.querySelector('input[name="treadDepth"]:checked').value;
                const selectedSupplier = supplierSelect.value;
                const selectedSeason = document.querySelector('input[name="season"]:checked').value;
                const roundingOption = document.querySelector('input[name="rounding_option"]:checked').value;

                const treadDepthFactor = treadDepthMultipliers[selectedTreadDepth] || 1.0;
                const supplierFactor = supplierMultipliers[selectedSupplier] || 1.0;
                const seasonFactor = seasonMultipliers[selectedSeason] || 1.0;
                
                let calculatedPrice = (basePrice * supplierFactor * treadDepthFactor * yearFactor * seasonFactor);

                let finalPrice;
                if (roundingOption === '25') {
                    finalPrice = Math.round(calculatedPrice / 25) * 25;
                } else if (roundingOption === '50') {
                    finalPrice = Math.round(calculatedPrice / 50) * 50;
                } else {
                    finalPrice = calculatedPrice;
                }

                const finalPriceFormatted = finalPrice.toFixed(2);

                priceDisplay.textContent = `${finalPriceFormatted} грн`;
                resultDiv.classList.remove('hidden');
            };

            calculateBtn.addEventListener('click', calculatePrice);

            // Ініціалізація Firebase при завантаженні сторінки
            initFirebase();
        });
    </script>
</body>
</html>
