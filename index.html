<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Склад шин — облік</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
      <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">
        <div class="flex items-center justify-between gap-4">
          <h1 class="text-2xl sm:text-3xl font-bold text-blue-700">Облік складу шин</h1>
          <button id="clearAllBtn" class="text-sm sm:text-base px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700">Очистити все</button>
        </div>

        <section aria-labelledby="add-section-title" class="space-y-4">
          <h2 id="add-section-title" class="text-lg font-semibold">Додати новий товар</h2>
          <form id="addForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="name" class="block text-sm font-medium text-gray-600">Назва / Артикул</label>
              <input id="name" type="text" required placeholder="Напр. Michelin 205/55 R16" class="w-full mt-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="size" class="block text-sm font-medium text-gray-600">Розмір</label>
              <input id="size" type="text" required placeholder="Напр. 205/55 R16" class="w-full mt-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="season" class="block text-sm font-medium text-gray-600">Сезонність</label>
              <select id="season" class="w-full mt-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="summer">Літо</option>
                <option value="winter">Зима</option>
                <option value="all">Всесезонні</option>
              </select>
            </div>
            <div>
              <label for="price" class="block text-sm font-medium text-gray-600">Ціна, грн</label>
              <input id="price" type="number" min="0" step="1" placeholder="Напр. 1800" class="w-full mt-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="initialQty" class="block text-sm font-medium text-gray-600">Кількість</label>
              <input id="initialQty" type="number" min="0" step="1" value="0" class="w-full mt-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex items-end">
              <button type="submit" class="w-full sm:w-auto px-4 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">Додати товар</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="list-section-title" class="space-y-4">
          <div class="flex items-center justify-between gap-4">
            <h2 id="list-section-title" class="text-lg font-semibold">Запаси</h2>
            <div class="text-sm text-gray-600">Всього позицій: <span id="statsItems">0</span> • Всього шин: <span id="statsQty">0</span></div>
          </div>

          <div class="overflow-x-auto border border-gray-200 rounded-xl">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Товар</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Розмір</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Сезон</th>
                  <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">Ціна</th>
                  <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">К-сть</th>
                  <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500">Операції</th>
                </tr>
              </thead>
              <tbody id="inventoryTbody" class="divide-y divide-gray-100 bg-white"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
